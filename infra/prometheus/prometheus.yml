global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: novapromo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # vLLM exposes TTFT, tokens, KV-cache usage and queue depth (enable with the vllm profile)
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  # NVIDIA DCGM exporter on the GPU host: GPU utilisation, memory, temperature, power
  - job_name: dcgm
    static_configs:
      - targets: ["gpu-server:9400"]
