[project]
name = "enterprise-onprem-ai-platform"
version = "0.1.0"
description = "On-premise enterprise AI platform showcase for a B2B promotional-products distributor (NovaPromo): hybrid search, permission-aware RAG, governed agents, approvals, batch jobs, local LLM inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "qdrant-client>=1.10",
  "elasticsearch>=8.13,<9",
  "redis>=5.0",
  "langgraph>=0.2",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "prometheus-client>=0.20",
  "sqlglot>=25",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "fpdf2>=2.7"]
# Optional real ML components (not needed for the demo; see docs/local-llm-and-gpu.md)
ml = ["fastembed>=0.3", "sentence-transformers>=3.0"]
mssql = ["pyodbc>=5.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "services*", "packages*", "scripts*", "evaluations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps/web", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["apps/web", "tests", ".data"]
